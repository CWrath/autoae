name: Build universal macOS release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach macOS app and FFmpeg assets to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install universal Python with Tk
        run: |
          curl --fail --location --silent --show-error \
            https://www.python.org/ftp/python/3.13.11/python-3.13.11-macos11.pkg \
            --output "$RUNNER_TEMP/python.pkg"
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13 \
            -c "import platform, tkinter; print(platform.machine(), tkinter.TkVersion)"

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13 -c \
            'import os; from app_version import APP_VERSION; expected = os.environ["RELEASE_TAG"].removeprefix("v"); assert APP_VERSION == expected, f"app_version.py has {APP_VERSION}, expected {expected}"'

      - name: Install app and build dependencies
        run: |
          PYTHON=/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13
          "$PYTHON" -m pip install --disable-pip-version-check \
            -r requirements-build-macos.txt \
            -r macos/requirements-macos.txt

      - name: Build native app
        run: /Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13 build_macos_autoae.py

      - name: Archive native app
        run: |
          mkdir -p "$RUNNER_TEMP/native-app"
          tar -czf "$RUNNER_TEMP/native-app/Auto AE ${{ matrix.architecture }}.tar.gz" \
            -C dist "Auto AE.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ matrix.architecture }}
          path: ${{ runner.temp }}/native-app/*.tar.gz
          if-no-files-found: error
          retention-days: 2

  build-ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install NASM for Intel FFmpeg build
        if: matrix.architecture == 'x86_64'
        run: brew install nasm

      - name: Build LGPL FFmpeg for this architecture
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/ffmpeg-build"
          bash macos/build_ffmpeg.sh "$OUTPUT"
          tar -czf "$RUNNER_TEMP/AutoAE-ffmpeg-${{ matrix.architecture }}.tar.gz" \
            -C "$OUTPUT" .

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-${{ matrix.architecture }}
          path: ${{ runner.temp }}/AutoAE-ffmpeg-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 2

  merge-and-attach:
    needs: [build-native, build-ffmpeg]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Download native app builds
        uses: actions/download-artifact@v4
        with:
          pattern: macos-app-*
          path: ${{ runner.temp }}/native-apps
          merge-multiple: true

      - name: Download native FFmpeg builds
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-build-*
          path: ${{ runner.temp }}/ffmpeg-builds
          merge-multiple: true

      - name: Extract and merge universal app
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/x86_64" "$RUNNER_TEMP/arm64"
          tar -xzf "$RUNNER_TEMP/native-apps/Auto AE x86_64.tar.gz" -C "$RUNNER_TEMP/x86_64"
          tar -xzf "$RUNNER_TEMP/native-apps/Auto AE arm64.tar.gz" -C "$RUNNER_TEMP/arm64"
          python3 macos/merge_universal_app.py \
            --x86-app "$RUNNER_TEMP/x86_64/Auto AE.app" \
            --arm-app "$RUNNER_TEMP/arm64/Auto AE.app" \
            --output-app "$RUNNER_TEMP/universal/Auto AE.app" \
            --output-zip dist/AutoAE-macos.zip \
            --expected-version "$VERSION"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12:?Missing MACOS_CERTIFICATE_P12 secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD secret}"
          : "${MACOS_SIGNING_IDENTITY:?Missing MACOS_SIGNING_IDENTITY secret}"
          KEYCHAIN_PATH="$RUNNER_TEMP/autoae-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/autoae-signing.p12"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          export CERTIFICATE_PATH
          python3 -c 'import base64, os; encoded = "".join(os.environ["MACOS_CERTIFICATE_P12"].split()); open(os.environ["CERTIFICATE_PATH"], "wb").write(base64.b64decode(encoded, validate=True))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F "$MACOS_SIGNING_IDENTITY"

      - name: Sign universal app
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/universal/Auto AE.app"
          codesign --deep --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Merge, sign, and package universal FFmpeg
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ffmpeg-x86_64" "$RUNNER_TEMP/ffmpeg-arm64"
          tar -xzf "$RUNNER_TEMP/ffmpeg-builds/AutoAE-ffmpeg-x86_64.tar.gz" \
            -C "$RUNNER_TEMP/ffmpeg-x86_64"
          tar -xzf "$RUNNER_TEMP/ffmpeg-builds/AutoAE-ffmpeg-arm64.tar.gz" \
            -C "$RUNNER_TEMP/ffmpeg-arm64"
          python3 macos/package_universal_ffmpeg.py \
            --intel-dir "$RUNNER_TEMP/ffmpeg-x86_64" \
            --arm-dir "$RUNNER_TEMP/ffmpeg-arm64" \
            --output-zip dist/AutoAE-ffmpeg-macos.zip \
            --source-output dist/AutoAE-ffmpeg-source-9.0.2.tar.xz \
            --notices macos/FFmpeg-LICENSE-NOTICE.txt \
            --license "$RUNNER_TEMP/ffmpeg-arm64/COPYING.LGPLv2.1" \
            --signing-identity "$MACOS_SIGNING_IDENTITY"

      - name: Rebuild ZIP with signed app
        run: |
          set -euo pipefail
          export APP_PATH="$RUNNER_TEMP/universal/Auto AE.app"
          python3 -c 'import os; from pathlib import Path; from macos.merge_universal_app import zip_app; zip_app(Path(os.environ["APP_PATH"]), Path("dist/AutoAE-macos.zip"), Path("macos/Install Auto AE README.txt"))'

      - name: Submit app for notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing APPLE_ID secret}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
          NOTARY_RESULT="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit dist/AutoAE-macos.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "$NOTARY_RESULT"
          cat "$NOTARY_RESULT"
          NOTARY_STATUS="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$NOTARY_RESULT")"
          if [[ "$NOTARY_STATUS" != "Accepted" ]]; then
            SUBMISSION_ID="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$NOTARY_RESULT")"
            echo "Apple notarization ended with status: $NOTARY_STATUS" >&2
            if ! xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json; then
              echo "Unable to retrieve the detailed Apple notarization log." >&2
            fi
            exit 1
          fi

      - name: Staple notarization ticket and rebuild ZIP
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/universal/Auto AE.app"
          for attempt in 1 2 3; do
            if xcrun stapler staple "$APP_PATH"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Could not staple the notarization ticket after 3 attempts." >&2
              exit 1
            fi
            echo "Stapling failed; retrying in $((attempt * 10)) seconds." >&2
            sleep "$((attempt * 10))"
          done
          for attempt in 1 2 3; do
            if xcrun stapler validate "$APP_PATH"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Could not validate the stapled ticket after 3 attempts." >&2
              exit 1
            fi
            echo "Staple validation failed; retrying in $((attempt * 10)) seconds." >&2
            sleep "$((attempt * 10))"
          done
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          export APP_PATH
          python3 -c 'import os; from pathlib import Path; from macos.merge_universal_app import zip_app; zip_app(Path(os.environ["APP_PATH"]), Path("dist/AutoAE-macos.zip"), Path("macos/Install Auto AE README.txt"))'

      - name: Create, sign, and notarize drag-install DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/universal/Auto AE.app"
          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          DMG_PATH="dist/AutoAE-macos.dmg"
          mkdir -p "$DMG_ROOT"
          /usr/bin/ditto "$APP_PATH" "$DMG_ROOT/Auto AE.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          cp "macos/Install Auto AE README.txt" "$DMG_ROOT/Install Auto AE README.txt"
          hdiutil create -volname "Auto AE" -srcfolder "$DMG_ROOT" \
            -ov -format UDZO "$DMG_PATH"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          for attempt in 1 2 3; do
            if xcrun stapler staple "$DMG_PATH"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Could not staple the DMG ticket after 3 attempts." >&2
              exit 1
            fi
            echo "DMG stapling failed; retrying in $((attempt * 10)) seconds." >&2
            sleep "$((attempt * 10))"
          done
          for attempt in 1 2 3; do
            if xcrun stapler validate "$DMG_PATH"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Could not validate the stapled DMG ticket after 3 attempts." >&2
              exit 1
            fi
            echo "DMG staple validation failed; retrying in $((attempt * 10)) seconds." >&2
            sleep "$((attempt * 10))"
          done
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -n "${CERTIFICATE_PATH:-}" ]]; then
            rm -f "$CERTIFICATE_PATH"
          fi

      - name: Attach macOS app to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/AutoAE-macos.zip \
            dist/AutoAE-macos.dmg \
            dist/AutoAE-ffmpeg-macos.zip \
            dist/AutoAE-ffmpeg-source-9.0.2.tar.xz \
            --repo "$GITHUB_REPOSITORY" --clobber
